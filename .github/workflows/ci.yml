name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json, mbstring
      - name: Syntax check
        run: find src config database routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Pure-logic checks
        run: php tests/smoke.php
      - name: Installer building blocks and stubs
        run: php tests/publisher.php

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Global bundle is up to date
        run: |
          npm run build
          git diff --exit-code resources/dist
